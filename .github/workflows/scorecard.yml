name: Scorecard

# OpenSSF Scorecard supply chain assessment. Feeds the Security tab, the public
# scorecard API and the badge in README.md.
on:
  push:
    branches: [prod]
  schedule:
    - cron: "30 4 * * 1"

permissions: {}

jobs:
  analyse:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Scorecard verifies its own workflow run.
      actions: read
      # For publishing results to the scorecard API.
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: results.sarif
