name: Release

# Publishes an existing version tag. Manual only.

# Tags are cut by the Tag workflow; tags belong to the prod branch.

on:
  # Dispatch against the version tag: the ref picker is the tag selector, so
  # there is nothing to type. Selecting a branch is refused below.

  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  queue: max

env:
  # Check for updates manually.
  # Also read by the Makefile, so a local goreleaser run matches the pipeline.
  GORELEASER_VERSION: v2.18.2
  SYFT_VERSION: v1.54.0

jobs:
  authorise:
    name: Authorise Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-major
    permissions: {}
    steps:
      - name: Restrict releases to the repository owner
        env:
          ACTOR: ${{ github.triggering_actor }}
          ALLOWED: <RELEASE_OWNER>
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "$ALLOWED" ]; then
            echo "::error::Releases are restricted to '${ALLOWED}'. '${ACTOR}' may not publish."
            exit 1
          fi
          echo "Release authorised for ${ACTOR}."

  release:
    name: Build and Publish Release
    needs: authorise
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # For build provenance attestations.
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Validate Tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this against a tag, not '${TAG}'. Pick the version tag in the ref selector."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'${TAG}' is not a release tag."
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout at the Tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # Off. This job publishes the release binaries, so a poisoned
          # build cache would reach them. The cache saves nothing with no dependencies.
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # The sboms hook in .goreleaser.yaml invokes `syft` by name.
      - name: Put Syft on PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT_CMD" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: prod

      - name: Attest Archives
        id: attest-archives
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # The attestation also lands in GitHub's attestation store, but that is not a
      # release asset: publishing the bundle gives an offline verification path and
      # is also what OpenSSF Scorecard's Signed-Releases check looks for.
      - name: Publish the Attestation Bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUNDLE: ${{ steps.attest-archives.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ ! -s "$BUNDLE" ]; then
            echo "::error::Attestation bundle missing at '${BUNDLE}'."
            exit 1
          fi
          cp "$BUNDLE" "<BINARY_NAME>_${VERSION}.sigstore.json"
          gh release upload "$TAG" "<BINARY_NAME>_${VERSION}.sigstore.json" --clobber

      - name: Resolve Image Digest
        id: image
        run: |
          set -euo pipefail
          digest="$(jq -r '[.[] | select(.type | test("Docker")) | .extra.Digest? // empty] | unique | first // empty' dist/artifacts.json)"
          if [ -z "$digest" ]; then
            echo "::error::No image digest in dist/artifacts.json; cannot attest the image."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: <OPENCONTAINERS_ADDRESS>
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # GoReleaser creates the release as a draft, so it goes live fully labelled
      # rather than briefly carrying the wrong latest flag.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest

  notes:
    name: Release notes
    needs: [release]
    # Ceiling for the called workflow: it cannot request more than this.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ github.ref_name }}
      channel: prod
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
